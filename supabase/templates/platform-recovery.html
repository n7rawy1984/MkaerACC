<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"></head><body>
  <h1>NARVO ERP password recovery</h1>
  <p><a href="{{ if .RedirectTo }}{{ .RedirectTo }}{{ else }}{{ .SiteURL }}/auth/callback{{ end }}?token_hash={{ .TokenHash }}&amp;type=recovery">Choose a new password</a></p>
  <p>If you did not request password recovery, ignore this message. Do not forward this link.</p>
  <p>Password recovery does not remove the Platform Owner authenticator requirement.</p>
</body></html>
